<script>
(function () {
  "use strict";

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  /* ============================================================
     DATA — 2026 年放假安排：国务院办公厅 2025-11-04 通知
     春节 2/15-2/23（2/14、2/28 上班）｜元旦 1/1-1/3（1/4 上班）
     清明 4/4-4/6｜劳动节 5/1-5/5（5/9 上班）｜端午 6/19-6/21
     中秋 9/25-9/27｜国庆 10/1-10/7（9/20、10/10 上班）
     ============================================================ */
  var HOLIDAYS = {
    2026: {
      rest: {
        "2026-01-01": "元旦", "2026-01-02": "元旦", "2026-01-03": "元旦",
        "2026-02-15": "春节", "2026-02-16": "春节", "2026-02-17": "春节", "2026-02-18": "春节",
        "2026-02-19": "春节", "2026-02-20": "春节", "2026-02-21": "春节", "2026-02-22": "春节",
        "2026-02-23": "春节",
        "2026-04-04": "清明节", "2026-04-05": "清明节", "2026-04-06": "清明节",
        "2026-05-01": "劳动节", "2026-05-02": "劳动节", "2026-05-03": "劳动节",
        "2026-05-04": "劳动节", "2026-05-05": "劳动节",
        "2026-06-19": "端午节", "2026-06-20": "端午节", "2026-06-21": "端午节",
        "2026-09-25": "中秋节", "2026-09-26": "中秋节", "2026-09-27": "中秋节",
        "2026-10-01": "国庆节", "2026-10-02": "国庆节", "2026-10-03": "国庆节", "2026-10-04": "国庆节",
        "2026-10-05": "国庆节", "2026-10-06": "国庆节", "2026-10-07": "国庆节"
      },
      work: {
        "2026-01-04": "元旦调休上班",
        "2026-02-14": "春节调休上班", "2026-02-28": "春节调休上班",
        "2026-05-09": "劳动节调休上班",
        "2026-09-20": "国庆调休上班", "2026-10-10": "国庆调休上班"
      }
    }
  };

  /* 各法定节假日的"正日子"：放假区间内仅此日显示节日名，其余日期显示"休" */
  var HOLIDAY_CORE = {
    2026: {
      "01-01": "元旦", "02-17": "春节", "04-05": "清明节", "05-01": "劳动节",
      "06-19": "端午节", "09-25": "中秋节", "10-01": "国庆节"
    }
  };
  var STATUTORY_NAME = /^(元旦|春节|清明节|劳动节|端午节|中秋节|国庆节)$/;

  /* 公历固定节日 / 纪念日 */
  var FIXED = {
    "01-01": [["元旦", "holiday"]],
    "02-14": [["情人节", "memo"]],
    "03-08": [["妇女节", "memo"]],
    "03-12": [["植树节", "memo"]],
    "03-15": [["消费者权益日", "memo"]],
    "04-01": [["愚人节", "memo"]],
    "04-22": [["世界地球日", "memo"]],
    "04-23": [["世界读书日", "memo"]],
    "04-24": [["中国航天日", "memo"]],
    "05-01": [["劳动节", "holiday"]],
    "05-04": [["青年节", "memo"]],
    "05-12": [["护士节", "memo"], ["全国防灾减灾日", "memo"]],
    "05-31": [["世界无烟日", "memo"]],
    "06-01": [["儿童节", "memo"]],
    "06-05": [["世界环境日", "memo"]],
    "06-26": [["国际禁毒日", "memo"]],
    "07-01": [["建党节", "memo"], ["香港回归纪念日", "memo"]],
    "08-01": [["建军节", "memo"]],
    "09-03": [["抗战胜利纪念日", "memo"]],
    "09-10": [["教师节", "memo"]],
    "09-18": [["九一八事变纪念日", "memo"]],
    "10-01": [["国庆节", "holiday"]],
    "10-10": [["辛亥革命纪念日", "memo"]],
    "10-16": [["世界粮食日", "memo"]],
    "11-08": [["记者节", "memo"]],
    "11-09": [["全国消防日", "memo"]],
    "12-01": [["世界艾滋病日", "memo"]],
    "12-02": [["全国交通安全日", "memo"]],
    "12-04": [["国家宪法日", "memo"]],
    "12-13": [["国家公祭日", "memo"]],
    "12-20": [["澳门回归纪念日", "memo"]],
    "12-25": [["圣诞节", "memo"]]
  };

  /* 农历节日（2026 丙午马年，除夕 2/16 · 正月初一 2/17） */
  var LUNAR = {
    2026: {
      "02-16": "除夕", "02-17": "春节", "03-03": "元宵节", "03-20": "龙抬头",
      "06-19": "端午节", "08-19": "七夕节", "08-27": "中元节", "09-25": "中秋节",
      "10-18": "重阳节", "11-09": "寒衣节", "11-23": "下元节"
    }
  };

  /* 二十四节气（2026） */
  var TERMS = {
    2026: {
      "01-05": "小寒", "01-20": "大寒", "02-04": "立春", "02-18": "雨水",
      "03-05": "惊蛰", "03-20": "春分", "04-05": "清明", "04-20": "谷雨",
      "05-05": "立夏", "05-21": "小满", "06-05": "芒种", "06-21": "夏至",
      "07-07": "小暑", "07-23": "大暑", "08-07": "立秋", "08-23": "处暑",
      "09-07": "白露", "09-23": "秋分", "10-08": "寒露", "10-23": "霜降",
      "11-07": "立冬", "11-22": "小雪", "12-07": "大雪", "12-22": "冬至"
    }
  };

  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  var NOTES_KEY = "calendar_clock_notes_v1";
  var THEME_KEY = "calendar_clock_theme";
  var NOTIFY_KEY = "calendar_clock_notified_v1";
  var floatingCache = {};

  /* ============================ state ============================ */
  var rootEl = document.documentElement;
  var now = new Date();
  var displayYear = now.getFullYear();
  var selectedKey = isoOf(now);
  var notes = loadNotes();
  var ctxDateKey = null;
  var showTerms = true;
  var showFests = true;
  var calMode = "year";               /* year | month */
  var focusMonth = now.getMonth();    /* 月历模式聚焦的月份 */
  var themePref = rootEl.getAttribute("data-theme-pref") || "auto";

  /* ============================ utils ============================ */
  function isoOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isoToDate(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function mdOf(d) { return pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function weekCN(d) { return "星期" + WEEK[d.getDay()]; }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  /* 浮动节日：母亲节 5 月第二个周日、父亲节 6 月第三个周日、感恩节 11 月第四个周四 */
  function nthWeekday(year, monthIdx, weekday, nth) {
    var d = new Date(year, monthIdx, 1);
    var offset = (weekday - d.getDay() + 7) % 7;
    return new Date(year, monthIdx, 1 + offset + (nth - 1) * 7);
  }
  function floatingFestivals(year) {
    if (floatingCache[year]) return floatingCache[year];
    var map = {};
    var m = nthWeekday(year, 4, 0, 2); map[mdOf(m)] = map[mdOf(m)] || []; map[mdOf(m)].push(["母亲节", "memo"]);
    var f = nthWeekday(year, 5, 0, 3); map[mdOf(f)] = map[mdOf(f)] || []; map[mdOf(f)].push(["父亲节", "memo"]);
    var t = nthWeekday(year, 10, 4, 4); map[mdOf(t)] = map[mdOf(t)] || []; map[mdOf(t)].push(["感恩节", "memo"]);
    floatingCache[year] = map;
    return map;
  }

  function isCoreHoliday(d) { var c = HOLIDAY_CORE[d.getFullYear()]; return !!(c && c[mdOf(d)]); }

  /* 某一天的全部标注（供详情面板 / 时钟 / 弹窗使用） */
  function dayInfo(d) {
    var year = d.getFullYear(), md = mdOf(d), iso = isoOf(d);
    var out = [];
    var seen = {};
    function push(name, type) {
      if (!name || seen[name]) return;
      seen[name] = 1;
      out.push({ name: name, type: type });
    }
    var hy = HOLIDAYS[year];
    if (hy && hy.work[iso]) push(hy.work[iso], "work");
    if (hy && hy.rest[iso]) {
      var rn = hy.rest[iso];
      push(isCoreHoliday(d) ? rn : rn + "假期", "holiday");
    }
    var fx = FIXED[md];
    if (fx) { for (var i = 0; i < fx.length; i++) push(fx[i][0], fx[i][1]); }
    var fl = floatingFestivals(year)[md];
    if (fl) { for (var j = 0; j < fl.length; j++) push(fl[j][0], fl[j][1]); }
    var lu = LUNAR[year];
    if (lu && lu[md]) push(lu[md], STATUTORY_NAME.test(lu[md]) ? "holiday" : "memo");
    var tm = TERMS[year];
    if (tm && tm[md] && !nameCovered(seen, tm[md])) push(tm[md], "term");
    return out;
  }

  /* 节气名是否已被同名/近名节日包含（如「清明」已被「清明节」包含） */
  function nameCovered(seen, name) {
    for (var k in seen) { if (k.indexOf(name) >= 0) return true; }
    return false;
  }

  function isRest(d) { var hy = HOLIDAYS[d.getFullYear()]; return !!(hy && hy.rest[isoOf(d)]); }
  function isWork(d) { var hy = HOLIDAYS[d.getFullYear()]; return !!(hy && hy.work[isoOf(d)]); }

  /* 单元格内的小字标注：优先级 法定节假日 > 节日/纪念日 > 调休上班 > 休 > 节气；最多两行，超出以「+N 项」折叠
     两组开关独立生效：showFests 控制节假日/节日/调休标注，showTerms 控制二十四节气标注 */
  var LABEL_ORDER = { holiday: 0, memo: 1, work: 2, rest: 3, term: 4 };
  function cellLabels(d) {
    var y = d.getFullYear(), md = mdOf(d);
    var list = [], seen = {};
    function add(name, type) {
      if (!name || seen[name]) return;
      seen[name] = 1;
      list.push({ name: name, type: type });
    }

    /* 先归纳「节假日」类标注，再由 showFests 决定是否输出 */
    var fest = [], festSeen = {};
    function addFest(name, type) {
      if (!name || festSeen[name]) return;
      festSeen[name] = 1;
      fest.push({ name: name, type: type });
    }

    var core = HOLIDAY_CORE[y] && HOLIDAY_CORE[y][md];
    if (core) addFest(core, "holiday");
    var fx = FIXED[md];
    if (fx) { for (var i = 0; i < fx.length; i++) addFest(fx[i][0], fx[i][1]); }
    var lu = LUNAR[y];
    if (lu && lu[md]) addFest(lu[md], STATUTORY_NAME.test(lu[md]) ? "holiday" : "memo");
    var fl = floatingFestivals(y)[md];
    if (fl) { for (var j = 0; j < fl.length; j++) addFest(fl[j][0], fl[j][1]); }

    /* 假期内没有节日名时才补「休」；调休补「班」 */
    if (isWork(d)) addFest("班", "work");
    else if (isRest(d) && !fest.length) addFest("休", "rest");

    if (showFests) {
      for (var k = 0; k < fest.length; k++) add(fest[k].name, fest[k].type);
    }

    if (showTerms) {
      var t = TERMS[y] && TERMS[y][md];
      if (t && !nameCovered(seen, t)) add(t, "term");
    }

    list.sort(function (a, b) { return LABEL_ORDER[a.type] - LABEL_ORDER[b.type]; });
    if (list.length > 2) return [list[0], { name: "+" + (list.length - 1) + " 项", type: "more" }];
    return list;
  }

  function hasData(year) { return !!HOLIDAYS[year] || !!TERMS[year] || !!LUNAR[year]; }

  /* ============================ notes storage ============================
     结构：{ "YYYY-MM-DD": { text: "…", remind: true|false } }
     兼容早期纯字符串结构：读取自动归一，写回时升级 */
  function loadNotes() {
    try {
      var raw = localStorage.getItem(NOTES_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === "object") ? obj : {};
    } catch (e) { return {}; }
  }
  function persist() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {}
  }
  function noteObj(k) {
    var v = notes[k];
    if (typeof v === "string") return v.trim() ? { text: v, remind: false } : null;
    if (v && typeof v === "object") {
      var t = typeof v.text === "string" ? v.text : "";
      return t.trim() ? { text: t, remind: !!v.remind } : null;
    }
    return null;
  }
  function getNote(k) { var o = noteObj(k); return o ? o.text : ""; }
  function getRemind(k) { var o = noteObj(k); return !!(o && o.remind); }
  function writeNote(k, text, remind) {
    var clean = String(text == null ? "" : text).replace(/^[ \t]*\n+/, "").replace(/\s+$/, "");
    if (clean) notes[k] = { text: clean, remind: !!remind };
    else delete notes[k];
    persist();
  }
  function setNote(k, text, remind) { writeNote(k, text, remind); renderAll(); }
  function removeNote(k) { writeNote(k, "", false); renderAll(); }
  function noteKeys() {
    return Object.keys(notes).filter(function (k) { return getNote(k); })
      .sort(function (a, b) { return a < b ? 1 : -1; });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============================ 笔记富文本（清单 / 标题 / 项目符号） ============================ */
  var RE_CHK = /^\s*[-*]\s+\[([ xX])\]\s?/;
  var RE_BUL = /^\s*[-*]\s+/;
  var RE_HD = /^\s*#{1,3}\s+(.*)$/;

  function noteLines(text) { return String(text).replace(/\r\n?/g, "\n").split("\n"); }

  function inline(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  /* 纯文本 → 富文本；清单复选框带 data-line，可点击勾选 */
  function richHTML(text) {
    var lines = noteLines(text), out = [], i = 0, n = lines.length;
    while (i < n) {
      var l = lines[i];
      if (RE_CHK.test(l)) {
        out.push('<ul class="nchk">');
        while (i < n && RE_CHK.test(lines[i])) {
          var m = lines[i].match(RE_CHK);
          var done = m[1].toLowerCase() === "x";
          out.push('<li><span class="cb' + (done ? " done" : "") + '" data-line="' + i +
            '" role="checkbox" aria-checked="' + (done ? "true" : "false") + '"></span>' +
            '<span class="ct' + (done ? " done" : "") + '">' +
            inline(lines[i].replace(RE_CHK, "")) + "</span></li>");
          i++;
        }
        out.push("</ul>");
        continue;
      }
      if (RE_BUL.test(l)) {
        out.push('<ul class="nbul">');
        while (i < n && RE_BUL.test(lines[i]) && !RE_CHK.test(lines[i])) {
          out.push("<li>" + inline(lines[i].replace(RE_BUL, "")) + "</li>");
          i++;
        }
        out.push("</ul>");
        continue;
      }
      var hm = l.match(RE_HD);
      if (hm) { out.push('<div class="nhd">' + inline(hm[1]) + "</div>"); i++; continue; }
      if (!l.trim()) { out.push('<div class="nsp"></div>'); i++; continue; }
      out.push('<div class="nln">' + inline(l) + "</div>");
      i++;
    }
    return out.join("");
  }

  /* 点击复选框：把对应行在 [ ] / [x] 之间切换并写回存储 */
  function toggleCheck(key, lineIdx) {
    var text = getNote(key);
    if (!text) return;
    var lines = noteLines(text);
    var m = lines[lineIdx] && lines[lineIdx].match(/^(\s*[-*]\s+\[)([ xX])(\][\s\S]*)$/);
    if (!m) return;
    lines[lineIdx] = m[1] + (m[2].toLowerCase() === "x" ? " " : "x") + m[3];
    writeNote(key, lines.join("\n"), getRemind(key));
    renderAll();
  }

  /* 待办进度统计 */
  function checkStat(text) {
    var lines = noteLines(text), total = 0, done = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(RE_CHK);
      if (!m) continue;
      total++;
      if (m[1].toLowerCase() === "x") done++;
    }
    return { total: total, done: done };
  }

  /* 笔记纯文本首行摘要 */
  function noteHead(text, max) {
    var lines = noteLines(text);
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].replace(RE_CHK, "").replace(RE_BUL, "").trim();
      if (t) return t.slice(0, max || 22);
    }
    return "";
  }

  /* ============================ theme ============================ */
  var THEME_ORDER = ["auto", "light", "dark"];
  var THEME_TXT = { auto: "跟随系统", light: "浅色", dark: "深色" };
  var THEME_ICON = {
    auto: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 010 16.8z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg>',
    dark: '<svg viewBox="0 0 24 24"><path d="M20 14.2A8.4 8.4 0 019.8 4 8.6 8.6 0 1020 14.2z"/></svg>'
  };
  function prefersDark() {
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function applyTheme(pref, silent) {
    themePref = THEME_ORDER.indexOf(pref) >= 0 ? pref : "auto";
    var dark = themePref === "dark" || (themePref === "auto" && prefersDark());
    rootEl.setAttribute("data-theme", dark ? "dark" : "light");
    rootEl.setAttribute("data-theme-pref", themePref);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0a0c12" : "#f7f6f2");
    var btn = $("#themeBtn");
    if (btn) {
      btn.innerHTML = THEME_ICON[themePref];
      btn.title = "主题：" + THEME_TXT[themePref] + "（点击切换）";
      btn.setAttribute("aria-label", btn.title);
    }
    syncThemeUI();
    if (!silent) { try { localStorage.setItem(THEME_KEY, themePref); } catch (e) {} }
  }
  function cycleTheme() {
    applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length]);
  }
  /* 工具栏浅色/深色快捷开关：图标为当前模式，文字为点击后将切换到的模式 */
  function syncThemeUI() {
    var dark = rootEl.getAttribute("data-theme") === "dark";
    var txt = $("#themeBarTxt"), icon = $("#themeBarIcon"), barBtn = $("#themeBarBtn");
    if (txt) txt.textContent = dark ? "浅色" : "深色";
    if (icon) icon.innerHTML = dark ? THEME_ICON.light : THEME_ICON.dark;
    if (barBtn) {
      barBtn.title = dark ? "当前为深色模式，点击切换到浅色" : "当前为浅色模式，点击切换到深色";
      barBtn.setAttribute("aria-label", barBtn.title);
    }
  }

  /* ============================ clock ============================ */
  function tick() {
    var d = new Date();
    var h = pad(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
    if ($("#hh").textContent !== h) $("#hh").textContent = h;
    if ($("#mm").textContent !== m) $("#mm").textContent = m;
    if ($("#ss").textContent !== s) {
      $("#ss").textContent = s;
      $("#secFill").style.width = ((d.getSeconds() + d.getMilliseconds() / 1000) / 60 * 100).toFixed(1) + "%";
    }
    var ds = d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · " + weekCN(d);
    if ($("#clockDate").textContent !== ds) $("#clockDate").textContent = ds;

    var yearEl = $("#clockYear"), hintEl = $("#hintYear");
    if (yearEl.textContent !== String(d.getFullYear())) {
      yearEl.textContent = d.getFullYear();
      hintEl.textContent = d.getFullYear();
    }
    if (!tick.lastKey || tick.lastKey !== isoOf(d)) {
      tick.lastKey = isoOf(d);
      renderClockTags(d);
      renderClockStrip(d);
    }
    requestAnimationFrame(tick);
  }

  function renderClockTags(d) {
    var host = $("#clockTags");
    var items = dayInfo(d).filter(function (x) { return x.type === "holiday" || x.type === "memo"; });
    var dayKey = isoOf(d);
    if (getNote(dayKey)) items.unshift({ name: "有笔记", type: "term" });
    if (!items.length) { host.innerHTML = ""; return; }
    host.innerHTML = items.map(function (x) {
      return '<span class="tag ' + x.type + '">' + esc(x.name) + "</span>";
    }).join("");
  }

  /* 最近的节日 / 节气（含今天），向后最多找 400 天 */
  function nextFestival(from) {
    var y0 = from.getFullYear(), m0 = from.getMonth(), d0 = from.getDate();
    for (var i = 0; i <= 400; i++) {
      var t = new Date(y0, m0, d0 + i);
      var info = dayInfo(t), pick = null, j;
      for (j = 0; j < info.length; j++) {
        if (info[j].type === "holiday" && !/假期$/.test(info[j].name)) { pick = info[j]; break; }
      }
      if (!pick) {
        for (j = 0; j < info.length; j++) {
          if (info[j].type === "term") { pick = info[j]; break; }
        }
      }
      if (pick) return { date: t, name: pick.name, type: pick.type, days: i };
    }
    return null;
  }

  /* 时钟页：节日倒计时 + 今日笔记摘要 + 提醒入口 */
  function renderClockStrip(d) {
    var el = $("#csCount");
    if (el) {
      var nx = nextFestival(d);
      if (!nx) el.innerHTML = "";
      else if (nx.days === 0) el.innerHTML = '今天 · <b>' + esc(nx.name) + "</b>";
      else el.innerHTML = "距离 <b>" + esc(nx.name) + '</b> 还有 <span class="cs-num">' + nx.days + "</span> 天";
    }
    var ne = $("#csNote");
    if (ne) {
      var key = isoOf(d), txt = getNote(key);
      if (!txt) ne.innerHTML = "今天还没有笔记";
      else {
        var st = checkStat(txt);
        ne.innerHTML = st.total
          ? '今日待办 <b>' + st.done + " / " + st.total + "</b> 项"
          : "今日笔记 · <b>" + esc(noteHead(txt, 16)) + "</b>";
      }
    }
    var rb = $("#remindBtn");
    if (rb) {
      var canAsk = ("Notification" in window) && Notification.permission === "default";
      rb.style.display = canAsk ? "" : "none";
    }
  }

  /* 到期提醒：进入页面时，对「今天 ~ 今天+3 天」区间内开启了提醒的笔记推送一次系统通知 */
  function notifyIfNeeded() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var t = new Date(), today = isoOf(t), last = null;
    try { last = localStorage.getItem(NOTIFY_KEY); } catch (e) {}
    if (last === today) return;
    var end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3);
    var endKey = isoOf(end), list = [];
    noteKeys().forEach(function (k) {
      if (getRemind(k) && k >= today && k <= endKey) list.push(k);
    });
    if (!list.length) return;
    list.sort();
    var body = list.map(function (k) {
      var d = isoToDate(k);
      var head = noteHead(getNote(k), 18);
      return (k === today ? "今天 · " : (d.getMonth() + 1) + "月" + d.getDate() + "日 · ") + head;
    }).join("\n");
    try {
      new Notification("日历到期提醒（" + list.length + " 项）", {
        body: body, tag: "calendar-clock-remind", icon: "icons/icon-192.png"
      });
      localStorage.setItem(NOTIFY_KEY, today);
    } catch (e) {}
  }

  /* ============================ calendar render ============================ */
  function renderCalendar() {
    var host = $("#months");
    var t = new Date();
    var isThisYear = displayYear === t.getFullYear();
    var today = isThisYear ? t : null;
    var html = "";
    if (calMode === "month") {
      html = monthHTML(displayYear, focusMonth, today, true);
    } else {
      for (var mo = 0; mo < 12; mo++) html += monthHTML(displayYear, mo, today, false);
    }
    host.innerHTML = html;
    host.classList.toggle("is-single", calMode === "month");
    renderMonthNav();

    $("#yearLabel").innerHTML = displayYear + ' <small>年</small>';
    $("#pageYear").textContent = displayYear;
    $("#dataNote").innerHTML = (hasData(displayYear)
      ? '<b>数据来源：</b>' + displayYear + ' 年放假调休安排依据《国务院办公厅关于 ' + displayYear +
        ' 年部分节假日安排的通知》，农历节日与二十四节气依当年历法换算。'
      : '<b>提示：</b>' + displayYear + ' 年的放假调休安排暂未收录，当前仅显示公历纪念日与浮动节日（母亲节、父亲节、感恩节）。') +
      '每个日期下方的小字为当日节日 / 纪念日 / 节气名称（过长时省略，悬停可看完整信息，点击日期在下方查看详情）；' +
      '法定节假日的正日子标注节日名，假期内其余日期标注「休」，调休上班日标注「班」；' +
      '同一日多项时最多显示两行，其余以「+N 项」折叠；无标注的日期不显示小字。' +
      '顶部「标注节假日」「标注节气」两个开关可分别控制这两类小字的显示与隐藏（默认均开启，点击即时生效）。' +
      '<b>月历视图：</b>把单月放大到整屏，日期格内直接显示笔记摘要，双击年历中任意月份标题即可切换。' +
      '<b>笔记：</b>用「- [ ]」书写待办清单，查看时可直接点击方框勾选（自动保存）；编辑弹窗内提供常用模板，' +
      '勾选「到期提醒」后，进入应用时会通过系统通知提醒当天与未来三天的待办。' +
      '<b>移动端：</b>底部导航可切换时钟 / 年历 / 月历；日历区左右滑动可翻年（月历模式翻月），双击月份标题放大该月。';
  }

  function renderMonthNav() {
    var nav = $("#monthNav");
    if (!nav) return;
    nav.hidden = calMode !== "month";
    if (calMode !== "month") return;
    $("#mnLabel").innerHTML = displayYear + ' 年 ' + (focusMonth + 1) + " 月";
    var days = new Date(displayYear, focusMonth + 1, 0).getDate();
    var rest = 0, ncount = 0, schedule = 0;
    for (var d = 1; d <= days; d++) {
      var dt = new Date(displayYear, focusMonth, d);
      if (isRest(dt)) rest++;
      if (getNote(isoOf(dt))) ncount++;
      schedule += dayInfo(dt).length ? 1 : 0;
    }
    $("#mnMeta").innerHTML =
      "<span>本月 " + days + " 天</span>" +
      "<span>节假日 " + rest + " 天</span>" +
      "<span>有标注 " + schedule + " 天</span>" +
      "<span>笔记 " + ncount + " 条</span>";
  }

  function monthHTML(year, mo, todayDate, solo) {
    var first = new Date(year, mo, 1);
    var lead = first.getDay();
    var days = new Date(year, mo + 1, 0).getDate();
    var cells = "";
    var restCount = 0, noteCount = 0;

    for (var b = 0; b < lead; b++) cells += '<div class="day pad"></div>';

    for (var day = 1; day <= days; day++) {
      var d = new Date(year, mo, day);
      var key = isoOf(d);
      var cls = ["day"];
      if (d.getDay() === 0 || d.getDay() === 6) cls.push("we");
      var rest = isRest(d), work = isWork(d);
      if (rest) { cls.push("rest"); restCount++; }
      if (work) cls.push("work");
      var isToday = todayDate && sameDay(d, todayDate);
      if (isToday) cls.push("today");
      if (key === selectedKey) cls.push("selected");

      var info = dayInfo(d);
      var tip = key + " " + weekCN(d);
      for (var i = 0; i < info.length; i++) tip += " · " + info[i].name;
      var noteText = getNote(key);
      if (noteText) { tip += " · 有笔记"; noteCount++; }
      var st = noteText ? checkStat(noteText) : null;
      if (st && st.total) tip += "（待办 " + st.done + "/" + st.total + "）";

      var labels = cellLabels(d);
      var labelHTML = labels.map(function (x) {
        return '<span class="dlabel ' + x.type + '">' + esc(x.name) + "</span>";
      }).join("");

      var preview = "";
      if (solo && noteText) {
        var head = noteHead(noteText, 14);
        preview = '<span class="dn">' + (st && st.total ? st.done + "/" + st.total + " " : "") + esc(head) + "</span>";
      }

      cells += '<div class="' + cls.join(" ") + '" data-date="' + key + '" title="' + esc(tip) + '">' +
        '<span class="num">' + day + "</span>" +
        labelHTML +
        preview +
        (noteText ? '<span class="note-flag"></span>' : "") +
        "</div>";
    }

    var total = lead + days;
    /* 统一补足到 6 周（42 格），保证 12 个月卡片等高、整墙对齐 */
    while (total < 42) { cells += '<div class="day pad"></div>'; total++; }

    var curMonth = todayDate && todayDate.getMonth() === mo;
    var countText = restCount ? "休 " + restCount + " 天" : (noteCount ? "笔记 " + noteCount + " 条" : "");
    return '<div class="month' + (curMonth ? " is-current" : "") + (solo ? " is-solo" : "") +
      '" data-month="' + mo + '">' +
      '<div class="m-head"><div class="m-name">' + (mo + 1) + " 月<em>" +
      (curMonth ? "本月" : monthSeason(mo)) + '</em></div><div class="m-count' +
      (countText ? "" : " hide") + '">' + countText + "</div></div>" +
      '<div class="m-week">' + WEEK.map(function (w, i) {
        return '<span class="' + ((i === 0 || i === 6) ? "we" : "") + '">' + w + "</span>";
      }).join("") + "</div>" +
      '<div class="m-grid">' + cells + "</div></div>";
  }

  function monthSeason(mo) {
    var s = ["冬", "冬", "春", "春", "春", "夏", "夏", "夏", "秋", "秋", "秋", "冬"];
    return s[mo] + "季";
  }

  /* ============================ 选中日期条 ============================ */
  function renderSide() {
    var d = isoToDate(selectedKey);
    var t = new Date();
    $("#sideDay").textContent = d.getDate();
    $("#sideMonth").textContent = (d.getMonth() + 1) + " 月 · " + d.getFullYear();
    $("#sideWeekday").innerHTML = weekCN(d) + (sameDay(d, t) ? ' <span class="chip-now">今天</span>' : "");

    var info = dayInfo(d);
    var order = { holiday: 0, work: 1, memo: 2, term: 3 };
    info.sort(function (a, b) { return order[a.type] - order[b.type]; });
    $("#sideTags").innerHTML = info.length
      ? info.map(function (x) { return '<span class="tag ' + x.type + '">' + esc(x.name) + "</span>"; }).join("")
      : '<span class="empty">无节假日 / 纪念日标注</span>';

    var note = getNote(selectedKey);
    var box = $("#sideNote");
    box.dataset.key = selectedKey;
    if (note) {
      box.className = "db-note";
      box.innerHTML = richHTML(note);
      /* 内容超出预览高度时底部渐隐 */
      requestAnimationFrame(function () {
        box.classList.toggle("clipped", box.scrollHeight > box.clientHeight + 2);
      });
    } else {
      box.className = "db-note is-empty";
      box.textContent = "暂无笔记 —— 右键该日期或点下方按钮添加";
    }
    $("#sideEditLabel").textContent = note ? "编辑笔记" : "添加笔记";
    $("#sideDelBtn").style.display = note ? "" : "none";
    $("#sideDelBtn").dataset.key = selectedKey;
  }

  function renderNotesList() {
    var keys = noteKeys();
    $("#notesCount").textContent = keys.length;
    var meta = $("#pageMeta");
    if (meta) {
      meta.textContent = (calMode === "month" ? "单月放大" : "12 个月 · 全年一览") +
        (keys.length ? " · " + keys.length + " 条笔记" : "");
    }
    var body = $("#notesBody");
    if (!keys.length) {
      body.innerHTML = '<div class="empty" style="padding:14px 4px">暂无笔记。在日历中右键任意日期即可添加。</div>';
      return;
    }
    body.innerHTML = keys.map(function (k) {
      var d = isoToDate(k);
      var txt = getNote(k);
      var st = checkStat(txt);
      var preview = txt.replace(RE_CHK, "").replace(/\n+/g, " ");
      var bell = getRemind(k)
        ? '<span class="ni-bell" title="已开启到期提醒"><svg viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 10-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"/><path d="M10.3 20a2 2 0 003.4 0"/></svg>提醒</span>'
        : "";
      return '<div class="note-item" data-key="' + k + '">' +
        '<div class="ni-head">' +
        '<span class="ni-date">' + d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日" +
        '<span class="ni-wd">' + weekCN(d) + (st.total ? " · 待办 " + st.done + "/" + st.total : "") + "</span></span>" +
        '<span style="display:flex;align-items:center;gap:9px">' + bell +
        '<span class="ni-del" data-del="' + k + '">删除</span></span></div>' +
        '<div class="ni-text">' + esc(preview) + "</div></div>";
    }).join("");
  }

  function renderAll() { renderCalendar(); renderSide(); renderNotesList(); }

  /* ============================ view / mode switching ============================ */
  function showCalendar(silent) {
    $("#view-clock").classList.remove("is-active");
    $("#view-calendar").classList.add("is-active");
    displayYear = new Date().getFullYear();
    renderAll();
    syncBottomNav();
    /* 首次进入用瞬时滚动把当前月带进视野即可，不做平滑滚动 */
    if (!silent && calMode === "year") scrollToMonth(focusMonth, false, false);
  }
  function showClock() {
    $("#view-calendar").classList.remove("is-active");
    $("#view-clock").classList.add("is-active");
    renderClockStrip(new Date());
    syncBottomNav();
  }
  function setMode(mode, mo) {
    calMode = (mode === "month") ? "month" : "year";
    if (typeof mo === "number" && !isNaN(mo)) focusMonth = Math.min(11, Math.max(0, mo));
    var seg = $("#viewSeg");
    if (seg) {
      Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
        b.classList.toggle("on", b.dataset.mode === calMode);
        b.setAttribute("aria-selected", b.dataset.mode === calMode ? "true" : "false");
      });
    }
    renderAll();
    syncBottomNav();
    if (calMode === "year") scrollToMonth(focusMonth, false, false);
  }
  function moveMonth(delta) {
    var m = focusMonth + delta;
    if (m < 0) { m = 11; displayYear--; }
    else if (m > 11) { m = 0; displayYear++; }
    focusMonth = m;
    renderAll();
  }
  function goToday() {
    var t = new Date();
    if (displayYear !== t.getFullYear()) displayYear = t.getFullYear();
    focusMonth = t.getMonth();
    renderAll();
    selectDay(isoOf(t), calMode === "year");
  }
  function syncBottomNav() {
    var nav = $("#bottomNav");
    if (!nav) return;
    var clockOn = $("#view-clock").classList.contains("is-active");
    Array.prototype.forEach.call(nav.querySelectorAll("[data-nav]"), function (b) {
      var n = b.dataset.nav, on = false;
      if (n === "clock") on = clockOn;
      else if (n === "year") on = !clockOn && calMode === "year";
      else if (n === "month") on = !clockOn && calMode === "month";
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
  }
  function scrollToMonth(mo, flash, smooth) {
    var el = $('.month[data-month="' + mo + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "nearest" });
    if (flash) {
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 1600);
    }
  }

  /* ============================ selection ============================ */
  function selectDay(key, scroll) {
    selectedKey = key;
    var prev = $(".day.selected");
    if (prev) prev.classList.remove("selected");
    var cell = $('.day[data-date="' + key + '"]');
    if (cell) cell.classList.add("selected");
    renderSide();
    if (scroll) {
      var d = isoToDate(key);
      if (d.getFullYear() === displayYear) {
        focusMonth = d.getMonth();
        if (calMode === "year") scrollToMonth(d.getMonth(), true, true);
      }
    }
  }

  /* ============================ context menu ============================ */
  var ctx = $("#ctx");
  var longPressTimer = null;

  function openCtx(x, y, key) {
    ctxDateKey = key;
    var d = isoToDate(key);
    var note = getNote(key);
    var items = [];
    if (note) {
      items.push({ id: "view", icon: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>', label: "查看笔记" });
      items.push({ id: "edit", icon: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>', label: "编辑笔记" });
      items.push({ sep: true });
      items.push({ id: "del", icon: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', label: "删除笔记", danger: true });
    } else {
      items.push({ id: "edit", icon: '<path d="M12 5v14M5 12h14"/>', label: "添加笔记" });
    }
    items.push({ sep: true });
    items.push({ id: "copy", icon: '<rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5.5A2.5 2.5 0 017.5 3H15"/>', label: "复制日期" });

    ctx.innerHTML =
      '<div class="ctx-hd"><b>' + (d.getMonth() + 1) + "月" + d.getDate() + "日</b><span>" + weekCN(d) + "</span></div>" +
      items.map(function (it) {
        if (it.sep) return '<div class="ctx-sep"></div>';
        return '<button class="ctx-item' + (it.danger ? " danger" : "") + '" data-act="' + it.id + '">' +
          '<svg viewBox="0 0 24 24">' + it.icon + "</svg>" + it.label + "</button>";
      }).join("");

    ctx.classList.add("open");
    var r = ctx.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.min(x, vw - r.width - 10);
    var top = Math.min(y, vh - r.height - 10);
    ctx.style.left = Math.max(10, left) + "px";
    ctx.style.top = Math.max(10, top) + "px";
    cellMark(key, true);
  }
  function cellMark(key, on) {
    var c = $('.day[data-date="' + key + '"]');
    if (c) c.classList.toggle("sel-side", !!on);
  }
  function closeCtx() {
    if (!ctx.classList.contains("open")) return;
    ctx.classList.remove("open");
    if (ctxDateKey) cellMark(ctxDateKey, false);
    ctxDateKey = null;
  }

  /* ============================ modal ============================ */
  var modalKey = null;
  var remindFlag = false;

  var TEMPLATES = [
    { label: "待办清单", text: "- [ ] " },
    { label: "会议记录", text: "会议主题：\n时间地点：\n参会人：\n结论：\n- [ ] 待跟进" },
    { label: "生日提醒", text: "生日：\n礼物：\n- [ ] 提前三天准备" },
    { label: "缴费提醒", text: "缴费项目：\n金额：\n截止日期：\n- [ ] 已完成缴费" },
    { label: "旅行计划", text: "目的地：\n日期：\n- [ ] 订票\n- [ ] 订房\n- [ ] 行程确认" }
  ];

  function renderTemplates() {
    var host = $("#tplRow");
    if (!host) return;
    host.innerHTML = '<span class="tpl-lb">模板</span>' + TEMPLATES.map(function (t, i) {
      return '<button type="button" class="tpl-btn" data-tpl="' + i + '">' + esc(t.label) + "</button>";
    }).join("");
  }
  function insertTemplate(i) {
    var t = TEMPLATES[i];
    if (!t) return;
    var ta = $("#mdText");
    var s = ta.selectionStart || 0, e2 = ta.selectionEnd || 0, v = ta.value;
    var pre = (s > 0 && v.charAt(s - 1) !== "\n") ? "\n" : "";
    var ins = pre + t.text;
    ta.value = v.slice(0, s) + ins + v.slice(e2);
    var pos = s + ins.length;
    ta.selectionStart = ta.selectionEnd = pos;
    ta.focus();
    updateMeta();
  }

  function setRemind(on) {
    remindFlag = !!on;
    var b = $("#mdRemind");
    if (b) b.classList.toggle("on", remindFlag);
  }

  function openModal(key) {
    modalKey = key;
    var d = isoToDate(key);
    $("#mdTitle").textContent = d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
    $("#mdSub").innerHTML = weekCN(d) + (sameDay(d, new Date()) ? ' <span class="chip-now">今天</span>' : "");
    var info = dayInfo(d);
    var chip = $("#mdChip");
    var first = info.filter(function (x) { return x.type === "holiday" || x.type === "work"; })[0];
    if (first) { chip.style.display = ""; chip.className = "tag " + first.type; chip.textContent = first.name; }
    else { chip.style.display = "none"; }
    var tags = info.filter(function (x) { return x.type === "memo" || x.type === "term"; });
    if (tags.length) {
      $("#mdSub").innerHTML += " · " + tags.map(function (x) { return esc(x.name); }).join(" · ");
    }
    $("#mdText").value = getNote(key);
    setRemind(getRemind(key));
    updateMeta();
    $("#modal").classList.add("open");
    setTimeout(function () { $("#mdText").focus(); }, 60);
  }
  function updateMeta() {
    var v = $("#mdText").value;
    var st = checkStat(v);
    var parts = [];
    if (v.length) parts.push(v.length + " 字");
    if (st.total) parts.push("待办 " + st.done + "/" + st.total);
    parts.push("自动保存到本机浏览器");
    $("#mdMeta").textContent = parts.join(" · ");
  }
  function closeModal() { $("#modal").classList.remove("open"); modalKey = null; }
  function saveModal() {
    if (!modalKey) return;
    setNote(modalKey, $("#mdText").value, remindFlag);
    closeModal();
  }

  /* ============================ events ============================ */
  $("#clockCard").addEventListener("click", function () { showCalendar(true); setMode("year", focusMonth); });
  $("#backBtn").addEventListener("click", showClock);
  $("#prevYear").addEventListener("click", function () {
    if (calMode === "month") return moveMonth(-1);
    displayYear--; renderAll();
  });
  $("#nextYear").addEventListener("click", function () {
    if (calMode === "month") return moveMonth(1);
    displayYear++; renderAll();
  });
  $("#todayBtn").addEventListener("click", goToday);
  $("#mPrev").addEventListener("click", function () { moveMonth(-1); });
  $("#mNext").addEventListener("click", function () { moveMonth(1); });

  $("#festBtn").addEventListener("click", function () {
    showFests = !showFests;
    this.classList.toggle("on", showFests);
    renderCalendar();
  });
  $("#termBtn").addEventListener("click", function () {
    showTerms = !showTerms;
    this.classList.toggle("on", showTerms);
    renderCalendar();
  });

  $("#viewSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]");
    if (!b) return;
    var t = new Date(), mo = focusMonth;
    if (b.dataset.mode === "month" && displayYear === t.getFullYear()) mo = t.getMonth();
    setMode(b.dataset.mode, mo);
  });

  $("#themeBtn").addEventListener("click", cycleTheme);

  $("#themeBarBtn").addEventListener("click", function () {
    applyTheme(rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  $("#bottomNav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-nav]");
    if (!b) return;
    var nav = b.dataset.nav, t = new Date();
    if (nav === "clock") { showClock(); return; }
    showCalendar(true);
    if (nav === "year") setMode("year", focusMonth);
    else if (nav === "month") setMode("month", displayYear === t.getFullYear() ? t.getMonth() : focusMonth);
    else if (nav === "today") goToday();
  });

  var monthsEl = $("#months");
  monthsEl.addEventListener("click", function (e) {
    var cell = e.target.closest(".day");
    if (!cell || cell.classList.contains("pad")) return;
    selectDay(cell.dataset.date, false);
  });

  monthsEl.addEventListener("contextmenu", function (e) {
    var cell = e.target.closest(".day");
    if (!cell || cell.classList.contains("pad")) return;
    e.preventDefault();
    selectDay(cell.dataset.date, false);
    openCtx(e.clientX, e.clientY, cell.dataset.date);
  });

  /* 双击年份中的月份标题 → 放大该月 */
  monthsEl.addEventListener("dblclick", function (e) {
    var card = e.target.closest(".month");
    if (!card) return;
    if (calMode === "year" || e.target.closest(".m-head")) {
      setMode("month", +card.dataset.month);
      window.scrollTo({ top: 0, behavior: "auto" });
    }
  });

  /* 触屏长按呼出菜单 + 左右滑动翻年/翻月 */
  var swipe = null;
  monthsEl.addEventListener("touchstart", function (e) {
    var cell = e.target.closest(".day");
    swipe = (e.touches.length === 1)
      ? { x: e.touches[0].clientX, y: e.touches[0].clientY, done: false }
      : null;
    if (!cell || cell.classList.contains("pad")) return;
    var touch = e.touches[0];
    longPressTimer = setTimeout(function () {
      selectDay(cell.dataset.date, false);
      openCtx(touch.clientX, touch.clientY, cell.dataset.date);
    }, 480);
  }, { passive: true });
  monthsEl.addEventListener("touchmove", function (e) {
    if (!swipe || swipe.done || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - swipe.x;
    var dy = e.touches[0].clientY - swipe.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swipe.done = true;
      clearTimeout(longPressTimer);
      if (calMode === "month") moveMonth(dx < 0 ? 1 : -1);
      else { displayYear += (dx < 0 ? 1 : -1); renderAll(); }
    }
  }, { passive: true });
  ["touchend", "touchcancel"].forEach(function (ev) {
    monthsEl.addEventListener(ev, function () { clearTimeout(longPressTimer); swipe = null; }, { passive: true });
  });

  ctx.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn || !ctxDateKey) return;
    var key = ctxDateKey, act = btn.dataset.act;
    closeCtx();
    if (act === "edit" || act === "view") openModal(key);
    else if (act === "del") { removeNote(key); selectDay(key, false); }
    else if (act === "copy") {
      try { navigator.clipboard.writeText(key); } catch (err) {}
    }
  });

  $("#sideEditBtn").addEventListener("click", function () { openModal(selectedKey); });
  $("#sideDelBtn").addEventListener("click", function () {
    removeNote(this.dataset.key);
    selectDay(this.dataset.key, false);
  });

  /* 查看区点击方框 → 勾选 / 取消待办 */
  $("#sideNote").addEventListener("click", function (e) {
    var cb = e.target.closest(".cb");
    if (!cb) return;
    toggleCheck(this.dataset.key || selectedKey, +cb.dataset.line);
  });

  var rb = $("#remindBtn");
  if (rb) {
    rb.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!("Notification" in window)) return;
      var ask = function () { renderClockStrip(new Date()); notifyIfNeeded(); };
      try {
        var p = Notification.requestPermission(ask);
        if (p && typeof p.then === "function") p.then(ask);
      } catch (err) {}
    });
  }

  $("#mdSave").addEventListener("click", saveModal);
  $("#mdText").addEventListener("input", updateMeta);
  $("#mdText").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveModal();
  });
  $("#tplRow").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tpl]");
    if (b) insertTemplate(+b.dataset.tpl);
  });
  $("#mdRemind").addEventListener("click", function () { setRemind(!remindFlag); });
  document.querySelectorAll("[data-close]").forEach(function (el) {
    el.addEventListener("click", closeModal);
  });

  $("#notesHead").addEventListener("click", function () {
    $("#notesWrap").classList.toggle("collapsed");
  });
  $("#notesBody").addEventListener("click", function (e) {
    var del = e.target.closest("[data-del]");
    if (del) {
      e.stopPropagation();
      removeNote(del.dataset.del);
      selectDay(del.dataset.del, false);
      return;
    }
    var item = e.target.closest(".note-item");
    if (!item) return;
    var key = item.dataset.key;
    var d = isoToDate(key);
    if (d.getFullYear() !== displayYear) displayYear = d.getFullYear();
    focusMonth = d.getMonth();
    selectDay(key, calMode === "year");
  });

  document.addEventListener("mousedown", function (e) {
    if (!ctx.contains(e.target)) closeCtx();
  });
  window.addEventListener("blur", closeCtx);
  window.addEventListener("resize", closeCtx);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeCtx(); closeModal(); }
  });

  /* 跨天自动刷新（每 30 秒校验一次） */
  setInterval(function () {
    var t = new Date();
    var k = isoOf(t);
    if (tick.lastKey && tick.lastKey !== k) {
      tick.lastKey = k;
      if ($("#view-calendar").classList.contains("is-active")) renderAll();
      notifyIfNeeded();
    }
  }, 30000);

  /* 系统主题变化时，跟随模式下实时同步 */
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onMq = function () { if (themePref === "auto") applyTheme("auto", true); };
    if (mq.addEventListener) mq.addEventListener("change", onMq);
    else if (mq.addListener) mq.addListener(onMq);
  }

  /* ============================ boot ============================ */
  applyTheme(themePref, true);
  renderTemplates();
  renderAll();
  tick();
  syncBottomNav();
  notifyIfNeeded();
  window.addEventListener("load", notifyIfNeeded);

  /* 支持 #clock / #year / #month 入口（PWA 快捷方式、外部书签） */
  (function () {
    var h = (location.hash || "").replace(/^#/, "");
    if (h === "month") { showCalendar(true); setMode("month", focusMonth); }
    else if (h === "year") { showCalendar(true); setMode("year", focusMonth); }
  })();

  /* PWA：仅在 http(s) 环境注册 Service Worker（file:// 打开时静默跳过，不影响本地使用） */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
